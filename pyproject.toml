[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treeforge"
version = "0.1.0"
description = "Android Device Bring-up Framework"
readme = "README.md"
requires-python = ">=3.11"

license = "Apache-2.0"

authors = [
    { name = "Dan Saporita" },
]

keywords = [
    "android",
    "aosp",
    "device-tree",
    "bringup",
    "firmware",
    "boot",
    "recovery",
    "pixel",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "typer",
    "rich",
    "pydantic",
    "lxml",
    "networkx",
    "pyelftools",
    "lz4>=4.4.0",
    "zstandard",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
treeforge = "treeforge.cli.main:app"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

norecursedirs = [
    ".git",
    ".venv",
    "workspace",
    "output",
    ".smoke",
]
